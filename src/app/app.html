<a class="skip-link" href="#main">Ugrás a tartalomhoz</a>

<ng-container *ngIf="{ vm: vm$ | async } as s">
  <div class="shell" [class.menu-open]="menuOpen">
    <div class="backdrop" aria-hidden="true" (click)="closeMenu()"></div>

    <aside class="sidebar" id="sidebar">
      <a class="brand" routerLink="/dashboard" (click)="closeMenu()">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-name">TeamFlow</span>
      </a>

      <nav #nav aria-label="Főmenü">
        <p class="nav-label">Munkaterület</p>
        <ul class="nav-list">
          <li *ngFor="let item of navItems; trackBy: trackByPath">
            <a
              class="nav-link"
              [routerLink]="item.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [attr.title]="item.label"
              (click)="closeMenu()"
            >
              <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
              <span class="nav-text">{{ item.label }}</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-user" *ngIf="s.vm?.current as me">
        <span class="avatar" aria-hidden="true">{{ initials(me.name) }}</span>
        <span class="user-text">
          <strong>{{ me.name }}</strong>
          <small>Csapattag</small>
        </span>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button
          #menuButton
          type="button"
          class="menu-btn"
          aria-controls="sidebar"
          [attr.aria-expanded]="menuOpen"
          aria-label="Menü"
          (click)="toggleMenu()"
        >
          <span aria-hidden="true">☰</span>
        </button>
        <span class="topbar-brand">TeamFlow</span>
        <p class="crumb">Frontend projekt <span aria-hidden="true">/</span> Csapatmunka</p>

        <ng-container *ngIf="s.vm as vm">
          <span class="team-pill" role="status">
            <ng-container *ngIf="!vm.error; else usersError">{{ vm.activeCount }} csapattag</ng-container>
            <ng-template #usersError>Csapat nem elérhető</ng-template>
          </span>
          <span class="avatar topbar-avatar" aria-hidden="true">{{
            vm.current ? initials(vm.current.name) : '?'
          }}</span>
        </ng-container>
      </header>

      <main id="main" class="content" tabindex="-1">
        <router-outlet />
      </main>
    </div>
  </div>
</ng-container>
